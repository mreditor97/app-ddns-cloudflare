---
name: Deploy

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_run:
    workflows: ['CI']
    branches: [master]
    types:
      - completed

jobs:
  workflows:
    name: App Deploy
    # hassio-addons/workflows v4.0.0
    uses: hassio-addons/workflows/.github/workflows/app-deploy.yaml@e0c532a7b0fb264b3ff0c718c2c0308a0c8c1390
    with:
      repository: 'homeassistant-apps'
      repository_beta: 'homeassistant-apps-beta'
      repository_edge: 'homeassistant-apps-edge'
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
