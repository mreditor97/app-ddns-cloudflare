---
name: Deploy

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  release:
    types:
      - published

permissions: {}

jobs:
  ci:
    name: CI
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    # hassio-addons/workflows v4.0.0
    uses: hassio-addons/workflows/.github/workflows/app-ci.yaml@e0c532a7b0fb264b3ff0c718c2c0308a0c8c1390

  deploy:
    name: App Deploy
    needs: ci
    permissions:
      contents: read
      packages: write
    # hassio-addons/workflows v4.0.0
    uses: hassio-addons/workflows/.github/workflows/app-deploy.yaml@e0c532a7b0fb264b3ff0c718c2c0308a0c8c1390
    with:
      repository: 'homeassistant-apps'
      repository_beta: 'homeassistant-apps-beta'
      repository_edge: 'homeassistant-apps-edge'
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
