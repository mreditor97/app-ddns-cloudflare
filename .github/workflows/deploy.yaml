---
name: Deploy

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_run:
    workflows: ['CI']
    branches: [master]
    types:
      - completed

jobs:
  workflows:
    name: App Deploy
    uses: hassio-addons/workflows/.github/workflows/app-deploy.yaml@main
    with:
      repository: 'homeassistant-apps'
      repository_beta: 'homeassistant-apps-beta'
      repository_edge: 'homeassistant-apps-edge'
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
