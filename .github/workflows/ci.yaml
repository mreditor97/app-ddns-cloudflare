---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions: {}

jobs:
  workflows:
    name: CI
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    # hassio-addons/workflows v4.0.0
    uses: hassio-addons/workflows/.github/workflows/app-ci.yaml@e0c532a7b0fb264b3ff0c718c2c0308a0c8c1390
